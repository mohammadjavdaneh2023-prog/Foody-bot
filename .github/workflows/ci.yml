name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: foody_test
          POSTGRES_USER: foody_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foody_test -d foody_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://foody_test:test-only-password@localhost:5432/foody_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Repository hygiene
        run: python scripts/check_repo_clean.py
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Validate operational shell scripts
        run: sh -n scripts/backup.sh scripts/restore.sh
      - name: Fresh PostgreSQL migrations
        run: python scripts/verify_migrations.py
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build --tag foody:ci .
