[project]
name = "foody"
version = "0.1.0"
description = "Telegram food-code watcher with a private control bot"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
